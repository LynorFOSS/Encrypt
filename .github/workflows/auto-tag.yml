name: Auto Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Generate tag
        id: tag
        run: |
          TAG=$(npm run tag --silent)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: exists
        run: |
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ steps.tag.outputs.tag }}

      - name: Create and push tag
        if: steps.exists.outputs.exists != 'true'
        run: |
          git tag -a "${TAG}" -m "Automated release tag ${TAG}"
          git push origin "${TAG}"
        env:
          TAG: ${{ steps.tag.outputs.tag }}
