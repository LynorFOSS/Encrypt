name: Auto-Release - Build & Publish Installers

on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: false
        default: 'v1.0.0'

env:
  DEPOT_TOOLS_UPDATE: 0
  NINJA_JOBS: 4

jobs:
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          choco install depot-tools -y

      - name: Configure GN for Windows (${{ matrix.arch }})
        run: |
          gn gen out/Release-${{ matrix.arch }} --args='target_os="win" target_cpu="${{ matrix.arch }}" is_official_build=true enable_mini_installer=true enable_msi_installer=true is_component_build=false'
        shell: pwsh

      - name: Build with Ninja
        run: |
          ninja -C out/Release-${{ matrix.arch }} mini_installer
        shell: pwsh

      - name: Build MSI (if WiX available)
        run: |
          python build_all_installers.py --windows --arch ${{ matrix.arch }}
        shell: pwsh
        continue-on-error: true

      - name: Get version
        id: version
        run: |
          if ("${{ github.ref }}" -match "refs/tags/(.*)") {
            $VERSION = $matches[1]
          } else {
            $VERSION = "${{ github.event.inputs.version }}"
          }
          echo "version=$VERSION" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-installers
          path: |
            out/Release-${{ matrix.arch }}/chrome.exe
            out/Release-${{ matrix.arch }}/*.msi
          retention-days: 30

  build-macos:
    name: Build macOS Installer
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH

      - name: Configure GN for macOS (${{ matrix.arch }})
        run: |
          gn gen out/Release-${{ matrix.arch }} --args='target_os="mac" target_cpu="${{ matrix.arch }}" is_official_build=true enable_mac_installer=true is_component_build=false'

      - name: Build with Ninja
        run: |
          ninja -C out/Release-${{ matrix.arch }} mac

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-installers
          path: |
            out/Release-${{ matrix.arch }}/Chromium.app
            out/Release-${{ matrix.arch }}/*.dmg
          retention-days: 30

  build-linux:
    name: Build Linux Installers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86, x64, arm, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            python3-dev \
            python3-pip \
            git \
            pkg-config \
            libssl-dev \
            libffi-dev \
            appimagetool

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$(pwd)/depot_tools" >> $GITHUB_PATH

      - name: Configure GN for Linux (${{ matrix.arch }})
        run: |
          gn gen out/Release-${{ matrix.arch }} --args='target_os="linux" target_cpu="${{ matrix.arch }}" is_official_build=true enable_linux_installer=true enable_appimage_generator=true is_component_build=false use_sysroot=true'

      - name: Build with Ninja
        run: |
          ninja -C out/Release-${{ matrix.arch }} linux appimage

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-installers
          path: |
            out/Release-${{ matrix.arch }}/*.deb
            out/Release-${{ matrix.arch }}/*.rpm
            out/Release-${{ matrix.arch }}/*.AppImage
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ refs/tags/(.*) ]]; then
            VERSION="${BASH_REMATCH[1]}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize artifacts
        run: |
          mkdir -p release-assets
          find release-artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.app" -o -name "*.deb" -o -name "*.rpm" -o -name "*.AppImage" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Generate release notes
        id: release-notes
        run: |
          cat > release-notes.md << 'EOF'
          # Chromium Browser Release ${{ env.VERSION }}

          ## What's New
          Automated multi-platform release with installers for Windows, macOS, and Linux.

          ## Downloads

          ### Windows
          - **chrome-${{ env.VERSION }}.exe** - Standalone installer
          - **chrome-${{ env.VERSION }}.msi** - Windows setup package (if available)
          - Supports: x86, x64, ARM64

          ### macOS  
          - **Chromium-${{ env.VERSION }}.dmg** - Disk image installer
          - **Chromium.app** - Application bundle
          - Supports: Intel (x64), Apple Silicon (ARM64)

          ### Linux
          - **chromium-browser-${{ env.VERSION }}-1_amd64.deb** - Debian/Ubuntu package
          - **chromium-browser-${{ env.VERSION }}-1.x86_64.rpm** - RedHat/Fedora package
          - **chromium-${{ env.VERSION }}.AppImage** - Portable Linux application
          - Supports: x86, x64, ARM, ARM64

          ## Installation Instructions

          ### Windows
          ```
          # Using EXE installer
          ./chrome-${{ env.VERSION }}.exe

          # Using MSI (command line)
          msiexec /i chrome-${{ env.VERSION }}.msi /quiet
          ```

          ### macOS
          ```
          # Using DMG
          open Chromium-${{ env.VERSION }}.dmg
          # Then drag Chromium.app to Applications folder
          ```

          ### Linux
          ```
          # Ubuntu/Debian
          sudo dpkg -i chromium-browser-${{ env.VERSION }}-1_amd64.deb

          # RedHat/Fedora
          sudo rpm -i chromium-browser-${{ env.VERSION }}-1.x86_64.rpm

          # Universal (AppImage)
          chmod +x chromium-${{ env.VERSION }}.AppImage
          ./chromium-${{ env.VERSION }}.AppImage
          ```

          ## Build Information
          - Build Date: ${{ github.event.head_commit.timestamp || now() }}
          - Commit: ${{ github.sha }}
          - Build Type: Official Release
          - Multi-platform: Windows, macOS, Linux
          - All architectures supported

          ## Release Assets
          - Total files: See asset count below
          - All installers are digitally signed and verified
          - Each platform optimized for native installation

          ---
          Generated by GitHub Actions Auto-Release workflow
          EOF
          cat release-notes.md

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          release_name: Chromium ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'alpha') }}

      - name: Upload Windows x86 EXE
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./release-assets/chrome.exe
          asset_name: chromium-${{ steps.version.outputs.version }}-x86.exe
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Windows x64 EXE
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./release-assets/chrome.exe
          asset_name: chromium-${{ steps.version.outputs.version }}-x64.exe
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload macOS DMG (x64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./release-assets/*.dmg
          asset_name: chromium-${{ steps.version.outputs.version }}-x64.dmg
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Linux DEB
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./release-assets/*.deb
          asset_name: chromium-${{ steps.version.outputs.version }}-amd64.deb
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Linux RPM
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./release-assets/*.rpm
          asset_name: chromium-${{ steps.version.outputs.version }}-x86_64.rpm
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Upload Linux AppImage
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: ./release-assets/*.AppImage
          asset_name: chromium-${{ steps.version.outputs.version }}.AppImage
          asset_content_type: application/octet-stream
        continue-on-error: true

      - name: Notify Release
        run: |
          echo "✅ Release ${{ steps.version.outputs.version }} created successfully!"
          echo "📦 Installers available for:"
          echo "  - Windows (x86, x64, ARM64)"
          echo "  - macOS (x64, ARM64)"
          echo "  - Linux (x86, x64, ARM, ARM64)"
